name: 'Setup Rhino3d'
description: 'Install Rhino3d on the runner'
author: 'McNeel'

inputs:
  email-address: # id of input
    description: 'Email address associated with the user'
    required: true
  release-version: # version to install
    description: 'Release version of Rhino3d to install: latest (default) or rc'
    required: false
  major-version:
    description: 'Major version of Rhino3d to install: 9 (default) or 8'
    required: false
  download-url:
    description:
      'Direct download URL. When set, release-version and major-version are
      ignored.'
    required: false

#todo: do we need any outputs?

runs:
  using: 'node24'
  main: 'dist/index.js'
