name: 'Setup Rhino3d'
description: 'Install Rhino3d on the runner'
author: 'McNeel'

inputs:
  email-address: # id of input
    description: 'Email address associated with the user'
    required: true
  release-version: # version to install
    description: 'Release version of Rhino3d to install'
    required: false
  major-version:
    description:
      'Major version of Rhino3d to install, e.g. 9. Defaults to 8 for latest/rc
      and 9 for wip.'
    required: false
  download-url:
    description:
      'Direct download URL. When set, release-version and major-version are
      ignored.'
    required: false

#todo: do we need any outputs?

runs:
  using: 'node24'
  main: 'dist/index.js'
